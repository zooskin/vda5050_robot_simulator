mqtt:
  broker_host: "localhost"
  broker_port: 1883

robot:
  manufacturer: "RobotCompany"
  serial_number: "AGV_001"
  interface_name: "uagv"
  protocol_version: "v2"

  initial_position:
    x: 8
    y: -10.8
    theta: 0.0
    map_id: "L1"

  max_speed: 0.5           # m/s
  rotation_speed: 0.7      # rad/s

  battery:
    initial_charge: 100.0
    discharge_rate: 0.01    # %/s while driving

publishing:
  state_interval: 0.5      # seconds
  visualization_interval: 1.0  # seconds
  simulation_tick: 0.05    # seconds (50ms)
